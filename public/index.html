<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL Manager | Kleini</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: rgba(255,255,255,0.8); font-size: 0.9rem; }
        input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.07); }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-add { background: linear-gradient(135deg, var(--primary), var(--secondary)); margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .device-list { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .device-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .device-item:hover { background: rgba(255,255,255,0.06); }
        .device-info h3 { font-size: 1rem; color: var(--primary); }
        .device-info p { font-size: 0.8rem; color: rgba(255,255,255,0.5); font-family: monospace; }

        .btn-delete { width: 40px; height: 40px; background: rgba(255,77,77,0.1); color: #ff4d4d; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-delete:hover { background: #ff4d4d; color: white; }

        .device-item.session-expired { border-color: rgba(255,77,77,0.4); background: rgba(255,77,77,0.06); }
        .session-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 10px; border-radius: 999px; background: rgba(255,77,77,0.15); color: #ff8080; font-size: 0.75rem; font-weight: 600; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(30px); display: flex; justify-content: center; align-items: center; z-index: 1000; }

        #logout-btn { color: var(--primary); cursor: pointer; font-size: 0.8rem; text-align: right; margin-top: 20px; display: block; }
    </style>
</head>
<body>

    <div id="login-overlay" class="overlay">
        <div class="glass-card" style="max-width: 350px;">
            <h1><i class="fas fa-lock"></i> Login</h1>
            <form id="login-form">
                <input type="password" id="admin-auth" placeholder="Admin Password" required style="margin-bottom: 15px;">
                <button type="submit" class="btn btn-add">Enter</button>
            </form>
            <div id="login-status" style="color: #ff4d4d; text-align: center; margin-top: 10px;"></div>
        </div>
    </div>

    <main id="dashboard" style="display: none; width: 100%; max-width: 500px;">
        <div class="glass-card">
            <h1><i class="fas fa-microchip"></i> WOL Center</h1>

            <form id="add-form">
                <div class="input-group">
                    <label>Device Name</label>
                    <input type="text" id="new-name" placeholder="e.g. Office, Gaming PC..." required>
                </div>
                <div class="input-group">
                    <label>MAC Address</label>
                    <input type="text" id="new-mac" placeholder="aa:bb:cc:dd:ee:ff" required>
                </div>
                <button type="submit" class="btn btn-add"><i class="fas fa-plus"></i> Add Device</button>
            </form>

            <div class="device-list" id="device-list">
                <!-- Devices loaded here -->
            </div>

            <a id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>

        <div class="glass-card" style="margin-top: 20px;">
            <h1><i class="fas fa-user"></i> Persons</h1>

            <form id="person-form">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="person-name" placeholder="e.g. Julia" required>
                </div>
                <div class="input-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="person-default" style="width: auto;">
                    <label for="person-default" style="margin: 0;">Default person ("Alexa, wo ist ...?" routine)</label>
                </div>
                <button type="submit" class="btn btn-add"><i class="fas fa-plus"></i> Add Person</button>
            </form>

            <div class="device-list" id="person-list">
                <!-- Persons loaded here -->
            </div>
        </div>

        <div class="glass-card" style="margin-top: 20px;">
            <h1><i class="fas fa-map-pin"></i> Zones</h1>

            <form id="zone-form">
                <div class="input-group">
                    <label>Name (speech-ready, e.g. "zu Hause", "bei der Arbeit")</label>
                    <input type="text" id="zone-name" placeholder="e.g. zu Hause" required>
                </div>
                <div class="input-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Latitude</label>
                        <input type="text" id="zone-lat" placeholder="51.5123" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Longitude</label>
                        <input type="text" id="zone-lng" placeholder="7.4567" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Radius (m)</label>
                        <input type="text" id="zone-radius" placeholder="150" required>
                    </div>
                </div>
                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="zone-home" style="width: auto;">
                        Home zone — the Mylo app puts its geofence around this one
                    </label>
                </div>
                <button type="button" class="btn" id="zone-locate" style="background: rgba(255,255,255,0.08);"><i class="fas fa-crosshairs"></i> Use my position</button>
                <button type="submit" class="btn btn-add"><i class="fas fa-plus"></i> Add Zone</button>
            </form>

            <div class="device-list" id="zone-list">
                <!-- Zones loaded here -->
            </div>
        </div>
    </main>

    <script>
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const dashboard = document.getElementById('dashboard');
        const listContainer = document.getElementById('device-list');
        const macInput = document.getElementById('new-mac');

        macInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9a-fA-F]/g, '');
            if (value.length > 12) value = value.slice(0, 12);
            const chunks = value.match(/.{1,2}/g);
            if (chunks) e.target.value = chunks.join(':').toLowerCase();
        });

        async function apiRequest(method, body = null, qs = '') {
            const password = localStorage.getItem('admin_password');
            const options = {
                method,
                headers: { 'Content-Type': 'application/json', 'x-admin-password': password }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch('/api/manage' + qs, options);
            if (res.status === 401) { logout(); return null; }
            return res.json();
        }

        function logout() {
            localStorage.removeItem('admin_password');
            window.location.reload();
        }

        // Alle Werte, die aus der API kommen, sind fremdbestimmt: der Ortsname
        // stammt z. B. aus dem address-Parameter von /api/location. Ohne
        // Escaping liesse sich darueber Skriptcode ins Dashboard schreiben und
        // damit das Admin-Passwort aus dem localStorage abgreifen.
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        // Loesch-Button ohne Inline-onclick: ein Name mit Apostroph (z. B.
        // "O'Brien") wuerde das Attribut sonst zerlegen und der Button
        // funktionierte stillschweigend nicht mehr.
        function deleteButton(handler) {
            const btn = document.createElement('button');
            btn.className = 'btn-delete';
            btn.innerHTML = '<i class="fas fa-trash"></i>';
            btn.addEventListener('click', handler);
            return btn;
        }

        function personItem(innerHtml, handler, extraClass = '') {
            const item = document.createElement('div');
            item.className = 'device-item' + extraClass;
            const info = document.createElement('div');
            info.className = 'device-info';
            info.innerHTML = innerHtml;
            item.appendChild(info);
            item.appendChild(deleteButton(handler));
            return item;
        }

        async function renderDevices() {
            const devices = await apiRequest('GET');
            if (!devices) return;

            listContainer.innerHTML = devices.length ? '' : '<p style="text-align:center; padding: 20px;">No devices configured.</p>';

            devices.forEach(dev => {
                const item = personItem(
                    `<h3>${esc(dev.name)}</h3><p>${esc(dev.mac)}</p>`,
                    () => deleteDevice(dev.mac)
                );
                listContainer.appendChild(item);
            });
        }

        window.deleteDevice = async (mac) => {
            if (confirm('Delete this device?')) {
                await apiRequest('DELETE', { mac });
                renderDevices();
            }
        };

        async function renderPersons() {
            const persons = await apiRequest('GET', null, '?type=locations');
            if (!persons) return;

            const container = document.getElementById('person-list');
            container.innerHTML = persons.length ? '' : '<p style="text-align:center; padding: 20px;">No persons configured.</p>';

            persons.forEach(p => {
                const loc = p.location;
                // Koordinaten nur als Zahlen in die Maps-URL, place/age als Text.
                const lat = Number(loc?.lat), lon = Number(loc?.lon);
                const mapsOk = Number.isFinite(lat) && Number.isFinite(lon);
                const locLine = loc
                    ? `📍 ${mapsOk
                          ? `<a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" rel="noopener" style="color: inherit;">${esc(loc.place)}</a>`
                          : esc(loc.place)} · ${esc(loc.age)}${loc.batt != null ? ` · 🔋 ${esc(loc.batt)}%` : ''}`
                    : 'Noch kein Standort empfangen';
                const expiredBadge = p.sessionExpired
                    ? '<div class="session-badge"><i class="fas fa-triangle-exclamation"></i> Samsung-Anmeldung abgelaufen – JSESSIONID erneuern</div>'
                    : (p.relaySilent
                        ? '<div class="session-badge"><i class="fas fa-plug-circle-xmark"></i> SmartTag-Relay meldet sich nicht mehr – VPS/Cron prüfen</div>'
                        : '');
                const item = personItem(
                    `<h3>${esc(p.name)} ${p.default ? '<i class="fas fa-star" title="Default person"></i>' : ''}</h3>
                     <p>${locLine}</p>
                     ${expiredBadge}`,
                    () => deletePerson(p.name),
                    p.sessionExpired || p.relaySilent ? ' session-expired' : ''
                );
                container.appendChild(item);
            });
        }

        setInterval(() => {
            if (dashboard.style.display !== 'none') renderPersons();
        }, 60000);

        window.deletePerson = async (name) => {
            if (confirm('Delete this person?')) {
                await apiRequest('DELETE', { name }, '?type=persons');
                renderPersons();
            }
        };

        async function renderZones() {
            const zones = await apiRequest('GET', null, '?type=zones');
            if (!zones) return;

            const container = document.getElementById('zone-list');
            container.innerHTML = zones.length ? '' : '<p style="text-align:center; padding: 20px;">No zones configured.</p>';

            zones.forEach(z => {
                // toFixed nur auf echten Zahlen: ein defekter Datensatz warf
                // sonst hier und riss die ganze Liste mit.
                const coords = (Number.isFinite(z.lat) && Number.isFinite(z.lng))
                    ? `${z.lat.toFixed(4)}, ${z.lng.toFixed(4)}`
                    : 'unbekannte Position';
                // Welche Zone die Mylo-App umzaeunt, gehoert in die Liste -
                // sonst sieht man es nur, indem man sie neu anlegt.
                const heim = z.home ? ' · <strong>home zone</strong>' : '';
                const item = personItem(
                    `<h3>${esc(z.name)}</h3><p>${coords} · ${esc(z.radius)} m${heim}</p>`,
                    () => deleteZone(z.name)
                );
                container.appendChild(item);
            });
        }

        window.deleteZone = async (name) => {
            if (confirm('Delete this zone?')) {
                await apiRequest('DELETE', { name }, '?type=zones');
                renderZones();
            }
        };

        document.getElementById('person-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('person-name').value;
            const isDefault = document.getElementById('person-default').checked;
            await apiRequest('POST', { name, default: isDefault }, '?type=persons');
            document.getElementById('person-form').reset();
            renderPersons();
        });

        document.getElementById('zone-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('zone-name').value;
            const lat = document.getElementById('zone-lat').value;
            const lng = document.getElementById('zone-lng').value;
            const radius = document.getElementById('zone-radius').value;
            const home = document.getElementById('zone-home').checked;
            await apiRequest('POST', { name, lat, lng, radius, home }, '?type=zones');
            document.getElementById('zone-form').reset();
            renderZones();
        });

        document.getElementById('zone-locate').addEventListener('click', () => {
            if (!navigator.geolocation) return alert('Geolocation not supported by this browser.');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('zone-lat').value = pos.coords.latitude.toFixed(6);
                    document.getElementById('zone-lng').value = pos.coords.longitude.toFixed(6);
                },
                () => alert('Could not determine position.')
            );
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-auth').value;
            localStorage.setItem('admin_password', pass);
            const test = await apiRequest('GET');
            if (test) {
                loginOverlay.style.display = 'none';
                dashboard.style.display = 'block';
                renderDevices();
                renderPersons();
                renderZones();
            } else {
                document.getElementById('login-status').innerText = '❌ Incorrect password.';
            }
        });

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const mac = document.getElementById('new-mac').value;
            await apiRequest('POST', { name, mac });
            document.getElementById('add-form').reset();
            renderDevices();
        });

        document.getElementById('logout-btn').addEventListener('click', logout);

        if (localStorage.getItem('admin_password')) {
            apiRequest('GET').then(res => {
                if (res) {
                    loginOverlay.style.display = 'none';
                    dashboard.style.display = 'block';
                    renderDevices();
                    renderPersons();
                    renderZones();
                }
            });
        }
    </script>
</body>
</html>
