name: Setup Location Feature

run-name: Setup Location Feature (vercel=${{ inputs.configure_vercel }}, relay=${{ inputs.deploy_relay }}, seed=${{ inputs.seed_data }})

on:
  workflow_dispatch:
    inputs:
      vercel_app_url:
        description: 'Vercel app URL (e.g. https://your-app.vercel.app)'
        required: true
        type: string
      default_person:
        description: 'Default person for "Alexa, wo ist ...?" (routine)'
        required: true
        default: 'Julia'
        type: string
      poll_interval:
        description: 'Relay poll interval in seconds'
        required: true
        default: '180'
        type: string
      configure_vercel:
        description: 'Set Vercel env vars (LOCATION_KEY, ALEXA_SKILL_ID, DEFAULT_PERSON) + redeploy'
        default: true
        type: boolean
      deploy_relay:
        description: 'Deploy google_location_relay.py to the VPS via SSH'
        default: true
        type: boolean
      seed_data:
        description: 'Create persons and zones via the manage API'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          LOCATION_KEY: ${{ secrets.LOCATION_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          PERSONS_MAP: ${{ secrets.PERSONS_MAP }}
        run: |
          missing=""
          if ${{ inputs.configure_vercel }} || ${{ inputs.deploy_relay }}; then
            [ -n "$LOCATION_KEY" ] || missing="$missing LOCATION_KEY"
          fi
          if ${{ inputs.configure_vercel }}; then
            [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
            [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          fi
          if ${{ inputs.deploy_relay }}; then
            [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
            [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
            [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
            [ -n "$GOOGLE_EMAIL" ] || missing="$missing GOOGLE_EMAIL"
            [ -n "$PERSONS_MAP" ] || missing="$missing PERSONS_MAP"
          fi
          if ${{ inputs.seed_data }}; then
            [ -n "$ADMIN_PASSWORD" ] || missing="$missing ADMIN_PASSWORD"
            [ -n "$PERSONS_MAP" ] || missing="$missing PERSONS_MAP"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets:$missing (see README section 8.6)"
            exit 1
          fi
          if [ -n "$PERSONS_MAP" ]; then
            echo "$PERSONS_MAP" | jq -e 'type == "object"' > /dev/null || { echo "::error::PERSONS_MAP is not a valid JSON object"; exit 1; }
          fi
          echo "All required secrets are present."

      - name: Configure Vercel environment variables
        if: ${{ inputs.configure_vercel }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          LOCATION_KEY: ${{ secrets.LOCATION_KEY }}
          ALEXA_SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
          DEFAULT_PERSON: ${{ inputs.default_person }}
        run: |
          api="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true"
          [ -n "$VERCEL_TEAM_ID" ] && api="${api}&teamId=${VERCEL_TEAM_ID}"

          set_env() {
            local key="$1" value="$2"
            local body http
            body=$(jq -n --arg k "$key" --arg v "$value" \
              '{key: $k, value: $v, type: "encrypted", target: ["production", "preview", "development"]}')
            http=$(curl -sS -o /tmp/vercel_resp.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
              echo "::error::Failed to set $key (HTTP $http): $(cat /tmp/vercel_resp.json)"
              exit 1
            fi
            echo "Set Vercel env var: $key"
          }

          set_env LOCATION_KEY "$LOCATION_KEY"
          set_env DEFAULT_PERSON "$DEFAULT_PERSON"
          if [ -n "$ALEXA_SKILL_ID" ]; then
            set_env ALEXA_SKILL_ID "$ALEXA_SKILL_ID"
          else
            echo "::notice::Secret ALEXA_SKILL_ID is not set yet. Create the custom skill (README 8.4), add the secret and re-run this workflow."
          fi

      - name: Trigger Vercel redeploy
        if: ${{ inputs.configure_vercel }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            echo "Redeploy triggered via deploy hook."
          else
            echo "::notice::Secret VERCEL_DEPLOY_HOOK is not set — trigger a redeploy manually in Vercel so the new env vars take effect."
          fi

      - name: Deploy location relay to VPS
        if: ${{ inputs.deploy_relay }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_COOKIES_B64: ${{ secrets.GOOGLE_COOKIES_B64 }}
          LOCATION_KEY: ${{ secrets.LOCATION_KEY }}
          PERSONS_MAP: ${{ secrets.PERSONS_MAP }}
          APP_URL: ${{ inputs.vercel_app_url }}
          POLL_INTERVAL: ${{ inputs.poll_interval }}
        run: |
          port="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          sshopts="-i $HOME/.ssh/vps_key -p $port -o StrictHostKeyChecking=accept-new"
          target="$VPS_USER@$VPS_HOST"
          if [ "$VPS_USER" = "root" ]; then home_dir="/root"; else home_dir="/home/$VPS_USER"; fi

          echo "Copying relay script..."
          scp -i ~/.ssh/vps_key -P "$port" -o StrictHostKeyChecking=accept-new \
            google_location_relay.py "$target:$home_dir/google_location_relay.py"

          if [ -n "$GOOGLE_COOKIES_B64" ]; then
            echo "Installing cookies file..."
            printf '%s' "$GOOGLE_COOKIES_B64" | ssh $sshopts "$target" \
              "base64 -d > $home_dir/google_cookies.txt && chmod 600 $home_dir/google_cookies.txt"
          else
            echo "::warning::Secret GOOGLE_COOKIES_B64 is not set — the relay will log 'Invalid or expired cookies' until you provide one (base64 -w0 cookies.txt)."
          fi

          echo "Installing Python dependencies..."
          ssh $sshopts "$target" \
            "pip3 install --quiet locationsharinglib requests 2>/dev/null || pip3 install --quiet --break-system-packages locationsharinglib requests"

          echo "Writing systemd unit..."
          # PERSONS_MAP contains JSON quotes; pass all config base64-encoded to survive both shells
          unit=$(cat <<UNIT
          [Unit]
          Description=Google Location Relay
          After=network.target

          [Service]
          Environment="COOKIES_FILE=$home_dir/google_cookies.txt"
          Environment="GOOGLE_EMAIL=$GOOGLE_EMAIL"
          Environment="VERCEL_URL=$APP_URL"
          Environment="LOCATION_KEY=$LOCATION_KEY"
          Environment='PERSONS_MAP=$PERSONS_MAP'
          Environment="POLL_INTERVAL=$POLL_INTERVAL"
          ExecStart=/usr/bin/python3 -u $home_dir/google_location_relay.py
          Restart=always
          RestartSec=30

          [Install]
          WantedBy=multi-user.target
          UNIT
          )
          printf '%s' "$unit" | base64 -w0 | ssh $sshopts "$target" \
            "base64 -d > /etc/systemd/system/google-location-relay.service"

          echo "Starting service..."
          ssh $sshopts "$target" \
            "systemctl daemon-reload && systemctl enable --now google-location-relay && systemctl restart google-location-relay"

          sleep 5
          if ssh $sshopts "$target" "systemctl is-active --quiet google-location-relay"; then
            echo "Service google-location-relay is active."
            ssh $sshopts "$target" "journalctl -u google-location-relay -n 5 --no-pager" || true
          else
            echo "::error::Service google-location-relay is not active:"
            ssh $sshopts "$target" "journalctl -u google-location-relay -n 20 --no-pager" || true
            exit 1
          fi

      - name: Seed persons and zones
        if: ${{ inputs.seed_data }}
        env:
          APP_URL: ${{ inputs.vercel_app_url }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PERSONS_MAP: ${{ secrets.PERSONS_MAP }}
          SETUP_ZONES: ${{ secrets.SETUP_ZONES }}
          DEFAULT_PERSON: ${{ inputs.default_person }}
        run: |
          base="${APP_URL%/}"

          post_manage() {
            local type="$1" body="$2" http
            http=$(curl -sS -o /tmp/manage_resp.json -w '%{http_code}' -X POST "$base/api/manage?type=$type" \
              -H "x-admin-password: $ADMIN_PASSWORD" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
              echo "::error::Failed to create $type entry (HTTP $http): $(cat /tmp/manage_resp.json)"
              exit 1
            fi
          }

          echo "Creating persons (from PERSONS_MAP values)..."
          echo "$PERSONS_MAP" | jq -r '.[]' | sort -u | while read -r name; do
            is_default=$(jq -n --arg n "$name" --arg d "$DEFAULT_PERSON" '$n == $d')
            post_manage persons "$(jq -n --arg n "$name" --argjson d "$is_default" '{name: $n, default: $d}')"
            echo "  person: $name (default: $is_default)"
          done

          if [ -n "$SETUP_ZONES" ]; then
            echo "$SETUP_ZONES" | jq -e 'type == "array"' > /dev/null || { echo "::error::SETUP_ZONES is not a valid JSON array"; exit 1; }
            echo "Creating zones (coordinates not logged)..."
            echo "$SETUP_ZONES" | jq -c '.[]' | while read -r zone; do
              post_manage zones "$zone"
              echo "  zone: $(echo "$zone" | jq -r '.name')"
            done
          else
            echo "::notice::Secret SETUP_ZONES is not set — no zones created. Add them via the dashboard or set the secret."
          fi

          echo "Verifying configured persons..."
          curl -fsS "$base/api/manage?type=persons" -H "x-admin-password: $ADMIN_PASSWORD" | jq -r '.[] | "  \(.name)\(if .default then " (default)" else "" end)"'

      - name: Summary
        run: |
          {
            echo "## Location feature setup"
            echo ""
            echo "| Step | Ran |"
            echo "|---|---|"
            echo "| Vercel env vars | ${{ inputs.configure_vercel }} |"
            echo "| VPS relay | ${{ inputs.deploy_relay }} |"
            echo "| Persons & zones | ${{ inputs.seed_data }} |"
            echo ""
            echo "**Remaining manual steps** (no APIs available):"
            echo "1. Google Maps location sharing on the phone → dedicated Google account (README 8.1)"
            echo "2. Export cookies.txt and store it as secret \`GOOGLE_COOKIES_B64\` (README 8.1)"
            echo "3. Create the Alexa custom skill, then add secret \`ALEXA_SKILL_ID\` and re-run (README 8.4)"
            echo "4. Create the Alexa routine \"wo ist julia\" (README 8.5)"
          } >> "$GITHUB_STEP_SUMMARY"
